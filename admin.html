<div id="loginGate">
  <div class="loginBox">
    <h1>🔐 Admin Login</h1>
    <p>GO 2408roomstore</p>
    <form id="loginForm">
      <label>Username</label>
      <input id="loginUser" autocomplete="username" required>
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
      <button class="loginBtn" type="submit">LOGIN</button>
      <div class="loginError" id="loginError">Username atau password salah.</div>
    </form>
  </div>
</div>
<script>
document.body.classList.add('locked');
async function checkAdmin(){
  try{
    const r=await fetch('/api/auth',{credentials:'include'});
    if(r.ok){document.getElementById('loginGate').remove();document.body.classList.remove('locked');}
  }catch(e){}
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
    body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});
  if(r.ok){location.reload();} else {document.getElementById('loginError').style.display='block';}
});
checkAdmin();
</script>

<script>
const panel = document.getElementById('panel');
const title = document.getElementById('panelTitle');
const form = document.getElementById('form');

function uploadBlock(id, label){
  return `
    <label>${label}</label>
    <div class="upload">
      <input type="file" id="${id}" accept="image/*">
      <img class="preview" id="${id}Preview">
      <div class="note">Upload foto dari HP/laptop. Preview akan muncul sebelum disimpan.</div>
    </div>
  `;
}

function attachPreview(id){
  const input = document.getElementById(id);
  const img = document.getElementById(id + 'Preview');

  if(!input) return;

  input.onchange = () => {
    const file = input.files[0];

    if(file){
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    }
  };
}

  form.innerHTML = html;

async function uploadFile(file){
  if(!file) return null;

  // 1. Minta signed upload URL ke server
  const response = await fetch('/api/upload', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    credentials: 'include',
    body: JSON.stringify({
      filename: file.name
    })
  });

  const result = await response.json();

  if(!response.ok){
    throw new Error(
      result.error || 'Gagal mendapatkan upload URL'
    );
  }

  // 2. Upload file LANGSUNG ke Supabase
  const uploadResponse = await fetch(
    result.signedUrl,
    {
      method: 'PUT',
      headers: {
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    }
  );

  if(!uploadResponse.ok){
    let errorMessage = 'Upload ke Supabase gagal';

    try {
      const errorData = await uploadResponse.json();
      errorMessage =
        errorData.message ||
        errorData.error ||
        errorMessage;
    } catch {}

    throw new Error(errorMessage);
  }

  // 3. Upload berhasil
  return result.path;

async function saved(){
  try{
    const photoInput = document.getElementById('photo');
    const qrisInput = document.getElementById('qris');

    let uploadedFiles = [];

    if(photoInput && photoInput.files[0]){
      const path = await uploadFile(photoInput.files[0]);
      uploadedFiles.push(path);
    }

    if(qrisInput && qrisInput.files[0]){
      const path = await uploadFile(qrisInput.files[0]);
      uploadedFiles.push(path);
    }

    alert(
      uploadedFiles.length
        ? 'File berhasil disimpan online di Supabase! 🎉'
        : 'Data berhasil diproses. 🎉'
    );

  }catch(error){
    alert('Upload gagal: ' + error.message);
  }
}
